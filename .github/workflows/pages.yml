name: Publish wedding website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - run: python build.py
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\")] | length")
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 5
          done
          echo "Pages artifact metadata is not available yet"
          exit 1
      - name: Deploy Pages using verified artifact
        id: deployment
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: context.runId});
            const matches = artifacts.data.artifacts.filter(a => a.name === process.env.ARTIFACT_NAME);
            if (matches.length !== 1) throw new Error('Expected exactly one Pages artifact');
            const deployment = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: matches[0].id,
              pages_build_version: context.sha, oidc_token: await core.getIDToken()
            });
            core.setOutput('page_url', deployment.data.page_url);
            for (let attempt = 0; attempt < 60; attempt++) {
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                owner, repo, deployment_id: deployment.data.id
              });
              if (result.data.status === 'succeed') return;
              if (['errored', 'failed', 'cancelled'].includes(result.data.status)) throw new Error('Pages deployment: ' + result.data.status);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages deployment timed out');
